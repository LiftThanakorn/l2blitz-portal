<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="baiumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1a" />
      <stop offset="50%" stop-color="#0f1d38" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="stormGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="lightningGlow">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#baiumBg)" />
  <rect width="800" height="500" fill="url(#stormGlow)" />

  <!-- Tower of Insolence 14th Floor Pillars & Arch -->
  <g fill="#0b1329" opacity="0.7">
    <rect x="60" y="80" width="45" height="420" />
    <rect x="140" y="120" width="35" height="380" />
    <rect x="625" y="120" width="35" height="380" />
    <rect x="695" y="80" width="45" height="420" />
    <!-- Celestial Ring in TOI 14F -->
    <circle cx="400" cy="220" r="160" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />
  </g>

  <!-- Baium Stone/Flesh Titan Silhouette -->
  <g transform="translate(400, 240)">
    <!-- Crown of Insolence -->
    <path d="M-55,-130 L-35,-165 L-15,-135 L0,-180 L15,-135 L35,-165 L55,-130 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
    <circle cx="0" cy="-145" r="5" fill="#38bdf8" filter="url(#lightningGlow)" />
    <!-- Giant Head -->
    <path d="M-40,-125 Q-55,-60 0,-40 Q55,-60 40,-125 Z" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <!-- Glowing Divine Eyes -->
    <line x1="-24" y1="-95" x2="-8" y2="-95" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#lightningGlow)" />
    <line x1="8" y1="-95" x2="24" y2="-95" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#lightningGlow)" />
    <!-- Massive Shoulders & Torso -->
    <path d="M-150,-20 L-60,-40 L0,-35 L60,-40 L150,-20 L130,120 L-130,120 Z" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Lightning Core on Chest -->
    <polygon points="0,-10 15,25 -5,35 10,70 -15,25 5,15" fill="#e0f2fe" filter="url(#lightningGlow)" />
    <polygon points="0,-10 15,25 -5,35 10,70 -15,25 5,15" fill="#ffffff" />
  </g>

  <!-- Tag & Text Overlay -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="130" height="26" rx="4" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="65" y="17" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">GRAND BOSS</text>
    <text x="145" y="19" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Baium (Lv. 75)</text>
    <text x="145" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Tower of Insolence 14F • 2–3 Days Respawn • Angelic Vortex Warp</text>
  </g>
</svg>
