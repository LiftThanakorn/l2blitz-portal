<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="valBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0704" />
      <stop offset="50%" stop-color="#380d07" />
      <stop offset="100%" stop-color="#0c0302" />
    </linearGradient>
    <radialGradient id="magmaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="fireBlur">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#valBg)" />
  <rect width="800" height="500" fill="url(#magmaGlow)" />

  <!-- Molten Lava Cavern in Forge of the Gods -->
  <path d="M0,450 Q200,420 400,460 T800,430 L800,500 L0,500 Z" fill="#b91c1c" filter="url(#fireBlur)" opacity="0.7" />
  <polygon points="0,0 110,130 190,0 350,150 490,0 640,160 740,0 800,100 800,0" fill="#260a05" />

  <!-- Valakas Fire Dragon Head -->
  <g transform="translate(400, 240)">
    <!-- Spiked Fire Crown & Horns -->
    <path d="M-70,-40 Q-160,-120 -230,-80 Q-160,-20 -95,20 Z" fill="#450a0a" stroke="#ef4444" stroke-width="3" />
    <path d="M70,-40 Q160,-120 230,-80 Q160,-20 95,20 Z" fill="#450a0a" stroke="#ef4444" stroke-width="3" />
    <!-- Dragon Crest -->
    <polygon points="-30,-120 0,-170 30,-120" fill="#f97316" stroke="#fbbf24" stroke-width="2" />
    <!-- Head Skull Structure -->
    <path d="M-85,-10 L-40,-95 L40,-95 L85,-10 L45,115 L-45,115 Z" fill="#360c07" stroke="#f97316" stroke-width="3.5" />
    <!-- Burning Magma Eyes -->
    <circle cx="-35" cy="-25" r="9" fill="#facc15" filter="url(#fireBlur)" />
    <circle cx="-35" cy="-25" r="4" fill="#ffffff" />
    <circle cx="35" cy="-25" r="9" fill="#facc15" filter="url(#fireBlur)" />
    <circle cx="35" cy="-25" r="4" fill="#ffffff" />
    <!-- Flame Breath Glow -->
    <circle cx="0" cy="90" r="15" fill="#f97316" filter="url(#fireBlur)" />
  </g>

  <!-- Tag & Text Overlay -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="130" height="26" rx="4" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="65" y="17" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">GRAND BOSS</text>
    <text x="145" y="19" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Valakas (Lv. 85)</text>
    <text x="145" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Forge of the Gods (Hall of Flames) • Fire Dragon of Aden</text>
  </g>
</svg>
