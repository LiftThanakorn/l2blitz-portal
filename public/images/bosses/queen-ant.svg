<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a04" />
      <stop offset="50%" stop-color="#241208" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>
    <radialGradient id="eggGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="qaBlur">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#qaBg)" />
  <rect width="800" height="500" fill="url(#eggGlow)" />

  <!-- Cave Stalactites -->
  <polygon points="0,0 60,110 130,0 210,130 290,0 480,120 560,0 680,140 760,0 800,90 800,0" fill="#1f110a" opacity="0.85" />
  <polygon points="0,500 90,430 180,500 310,410 440,500 620,420 730,500 800,440 800,500" fill="#180d07" />

  <!-- Queen Ant Silhouette & Royal Eyes -->
  <g transform="translate(400, 270)">
    <!-- Mandibles & Pincers -->
    <path d="M-90,-20 Q-150,20 -130,80 Q-90,50 -70,20 Z" fill="#451a03" />
    <path d="M90,-20 Q150,20 130,80 Q90,50 70,20 Z" fill="#451a03" />
    <!-- Ant Queen Thorax -->
    <ellipse cx="0" cy="-40" rx="65" ry="50" fill="#291104" stroke="#78350f" stroke-width="3" />
    <!-- Abdomen -->
    <ellipse cx="0" cy="50" rx="100" ry="85" fill="#3b1706" stroke="#b45309" stroke-width="4" />
    <!-- Royal Carapace Markings -->
    <path d="M-60,40 Q0,85 60,40" stroke="#f59e0b" stroke-width="5" fill="none" opacity="0.8" />
    <path d="M-40,80 Q0,110 40,80" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.8" />
    <!-- Glowing Red Eyes -->
    <circle cx="-28" cy="-55" r="7" fill="#ef4444" filter="url(#qaBlur)" />
    <circle cx="-28" cy="-55" r="4" fill="#fee2e2" />
    <circle cx="28" cy="-55" r="7" fill="#ef4444" filter="url(#qaBlur)" />
    <circle cx="28" cy="-55" r="4" fill="#fee2e2" />
    <!-- Antennae -->
    <path d="M-20,-75 Q-60,-130 -110,-140" stroke="#b45309" stroke-width="4" fill="none" />
    <path d="M20,-75 Q60,-130 110,-140" stroke="#b45309" stroke-width="4" fill="none" />
  </g>

  <!-- Tag & Text Overlay -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="130" height="26" rx="4" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="65" y="17" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">GRAND BOSS</text>
    <text x="145" y="19" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Queen Ant (Lv. 40)</text>
    <text x="145" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">The Ant Nest • 2–3 Days Respawn • Custom Warp Point</text>
  </g>
</svg>
