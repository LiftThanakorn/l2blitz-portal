<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="loaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608" />
      <stop offset="50%" stop-color="#240c10" />
      <stop offset="100%" stop-color="#090204" />
    </linearGradient>
    <radialGradient id="pvpGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#loaBg)" />
  <rect width="800" height="500" fill="url(#pvpGlow)" />

  <!-- Underworld Columns & Blood Mist -->
  <polygon points="0,0 90,130 180,0 290,150 420,0 580,140 700,0 800,110 800,0" fill="#1f090d" />
  <polygon points="0,500 140,400 300,500 480,390 640,500 800,420 800,500" fill="#170609" />

  <!-- Crossed Swords Icon in Center of LOA Hotzone -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="60" fill="#881337" opacity="0.4" />
    <path d="M-35,-35 L35,35 M35,-35 L-35,35" stroke="#fb7185" stroke-width="6" stroke-linecap="round" />
  </g>

  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="110" height="26" rx="4" fill="#f43f5e" opacity="0.2" stroke="#f43f5e" stroke-width="1.5" />
    <text x="55" y="17" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PARTY PVP</text>
    <text x="125" y="19" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">Lair of Antharas (LOA PvP Craft)</text>
    <text x="125" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Party Combat • PvP Hotzone • Ancient Scrolls &amp; S84 Craft</text>
  </g>
</svg>
