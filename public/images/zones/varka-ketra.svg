<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="varkaKetraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f09" />
      <stop offset="50%" stop-color="#1f180d" />
      <stop offset="100%" stop-color="#0a0805" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="65%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#varkaKetraBg)" />
  <rect width="800" height="500" fill="url(#sunGlow)" />

  <!-- Outpost Hills & Totems -->
  <path d="M0,380 Q250,280 500,360 T800,320 L800,500 L0,500 Z" fill="#140f0a" />
  <path d="M0,430 Q200,360 420,440 T800,390 L800,500 L0,500 Z" fill="#0d0a07" />

  <!-- Orc War Totems -->
  <g stroke="#78350f" stroke-width="8" stroke-linecap="round">
    <line x1="220" y1="230" x2="220" y2="440" />
    <line x1="180" y1="280" x2="260" y2="280" stroke-width="6" />
    <line x1="580" y1="200" x2="580" y2="420" />
    <line x1="540" y1="250" x2="620" y2="250" stroke-width="6" />
  </g>
  <!-- Skull on Totem -->
  <circle cx="220" cy="220" r="16" fill="#fef08a" opacity="0.7" />
  <circle cx="580" cy="190" r="16" fill="#fef08a" opacity="0.7" />

  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="110" height="26" rx="4" fill="#38bdf8" opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="55" y="17" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">STARTER ZONE</text>
    <text x="125" y="19" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">Varka &amp; Ketra Outpost (Lv. 80–85)</text>
    <text x="125" y="38" fill="#94a3b8" font-family="sans-serif" font-size="12">Solo / AutoFarm Allowed • Fast Respawn • Non-Aggressive Mobs</text>
