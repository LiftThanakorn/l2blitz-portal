<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tvtBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#031525" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#2a0508" />
    </linearGradient>
    <radialGradient id="blueSide" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="redSide" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="tvtGlow">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#tvtBg)" />
  <rect width="1200" height="480" fill="url(#blueSide)" />
  <rect width="1200" height="480" fill="url(#redSide)" />

  <!-- Center Clash Line -->
  <line x1="600" y1="0" x2="600" y2="480" stroke="#f1f5f9" stroke-width="2" stroke-dasharray="10 8" opacity="0.3" />

  <!-- Blue Team Side (Left) -->
  <g transform="translate(240, 240)">
    <circle cx="0" cy="0" r="85" fill="#0369a1" opacity="0.3" filter="url(#tvtGlow)" />
    <polygon points="0,-70 50,20 -50,20" fill="#38bdf8" stroke="#e0f2fe" stroke-width="3" />
    <text x="0" y="80" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3">BLUE TEAM</text>
  </g>

  <!-- VS Emblem in Center -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="50" fill="#0f172a" stroke="#475569" stroke-width="3" />
    <text x="0" y="14" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle">VS</text>
  </g>

  <!-- Red Team Side (Right) -->
  <g transform="translate(960, 240)">
    <circle cx="0" cy="0" r="85" fill="#be123c" opacity="0.3" filter="url(#tvtGlow)" />
    <polygon points="0,-70 50,20 -50,20" fill="#f43f5e" stroke="#ffe4e6" stroke-width="3" />
    <text x="0" y="80" fill="#f43f5e" font-family="sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3">RED TEAM</text>
  </g>
</svg>
