# /etc/nginx/sites-available/l2blitz-api.conf
# Nginx Reverse Proxy for L2BLITZ PVP Backend API (Ubuntu VPS <= 500 THB/month)
# Static frontend is hosted on Cloudflare Pages; API requests are served here.

limit_req_zone $binary_remote_addr zone=l2blitz_api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name api.l2blitz.in.th;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=l2blitz_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
