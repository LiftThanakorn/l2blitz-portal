# /etc/nginx/sites-available/l2blitz-api.conf
# Reverse Proxy for L2Blitz Backend API on Ubuntu VPS

limit_req_zone $binary_remote_addr zone=l2blitz_api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name api.l2blitz.in.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.l2blitz.in.th;

    # SSL Certificates (Let's Encrypt Certbot / Cloudflare Origin CA)
    ssl_certificate     /etc/ssl/certs/l2blitz-origin.pem;
    ssl_certificate_key /etc/ssl/private/l2blitz-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=l2blitz_api_limit burst=15 nodelay;

        # Strictly allow only Read-Only HTTP methods at the Nginx edge
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
    }
}
